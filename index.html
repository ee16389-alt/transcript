<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>即時逐字稿</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #f8fafc;
  --surface: #ffffff;
  --border: #e2e8f0;
  --primary: #6366f1;
  --primary-h: #4f46e5;
  --text: #1e293b;
  --muted: #64748b;
  --success: #10b981;
  --warning: #f59e0b;
  --danger: #ef4444;
  --r: 8px;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  padding: 1.5rem;
  max-width: 860px;
  margin: 0 auto;
}

h1 { font-size: 1.6rem; font-weight: 700; margin-bottom: .2rem; }
.sub { color: var(--muted); font-size: .875rem; margin-bottom: 1.25rem; }

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 1.1rem 1.25rem;
  margin-bottom: .875rem;
}

.card-title { font-size: .9rem; font-weight: 600; margin-bottom: .85rem; }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: .65rem; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: .65rem; }
.full  { grid-column: 1 / -1; }

label { display: block; font-size: .75rem; font-weight: 500; color: var(--muted); margin-bottom: .2rem; }

input[type=text], input[type=password], select {
  width: 100%; padding: .45rem .7rem;
  border: 1px solid var(--border); border-radius: 6px;
  font-size: .875rem; font-family: inherit; color: var(--text);
  background: var(--surface);
}
input:focus, select:focus { outline: none; border-color: var(--primary); }

.btn-row { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }

button {
  padding: .45rem 1rem; border: none; border-radius: 6px;
  font-size: .875rem; font-weight: 500; cursor: pointer;
  transition: background .12s, opacity .12s;
  white-space: nowrap;
}
button:disabled { opacity: .4; cursor: not-allowed; }

.bp  { background: var(--primary);   color: #fff; }
.bp:hover:not(:disabled) { background: var(--primary-h); }
.bs  { background: #f1f5f9; color: var(--text); }
.bs:hover:not(:disabled)  { background: #e2e8f0; }
.bd  { background: #fee2e2; color: var(--danger); }
.bd:hover:not(:disabled)  { background: #fecaca; }
.bg  { background: #d1fae5; color: #065f46; }
.bg:hover:not(:disabled)  { background: #a7f3d0; }

/* status bar */
#sbar {
  display: flex; align-items: center; gap: .6rem;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r); padding: .6rem 1rem;
  margin-bottom: .875rem; font-size: .875rem; color: var(--muted);
}
#sdot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--muted); flex-shrink: 0;
}
#sdot.rec  { background: var(--danger);  animation: blink 1.2s infinite; }
#sdot.proc { background: var(--warning); }
#sdot.done { background: var(--success); }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.35} }

/* transcript */
#tarea {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r); padding: 1.1rem 1.25rem;
  min-height: 280px; max-height: 58vh;
  overflow-y: auto; font-size: .9rem; line-height: 1.8;
}
.empty { color: var(--muted); font-size: .875rem; text-align: center; padding: 2.5rem 1rem; }
.seg-time { font-size: .72rem; font-weight: 600; color: var(--muted); margin-bottom: .2rem; letter-spacing: .02em; }
.seg-text { white-space: pre-wrap; word-break: break-word; }
.seg-translation {
  white-space: pre-wrap; word-break: break-word;
  margin-top: .4rem; padding: .4rem .7rem;
  background: #f0f9ff; border-left: 3px solid #38bdf8;
  border-radius: 0 4px 4px 0; color: #0369a1;
  font-size: .85rem;
}
.seg-translation-label {
  font-size: .68rem; font-weight: 600; color: #0369a1;
  text-transform: uppercase; letter-spacing: .05em; margin-bottom: .15rem;
}
.divider  { border: none; border-top: 1px solid var(--border); margin: .85rem 0; }

/* privacy note */
.note {
  font-size: .75rem; color: var(--muted);
  background: #f8fafc; border: 1px solid var(--border);
  border-radius: 6px; padding: .5rem .75rem;
  margin-top: .875rem;
}
</style>
</head>
<body>

<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:.2rem;">
  <div>
    <h1>即時逐字稿</h1>
    <p class="sub" style="margin-bottom:0">音訊在瀏覽器直接呼叫 Gemini 轉錄，API Key 只存在記憶體不寫入磁碟，逐字稿下載到本機。</p>
  </div>
  <div style="text-align:center;flex-shrink:0;">
    <div id="qrcode" style="display:inline-block;padding:6px;background:#fff;border:1px solid var(--border);border-radius:8px;"></div>
    <div style="font-size:.65rem;color:var(--muted);margin-top:.3rem;">掃描開啟此頁</div>
  </div>
</div>

<!-- Settings -->
<div class="card">
  <div class="card-title">設定</div>
  <div class="grid2">
    <div>
      <label>Gemini API Key</label>
      <input type="password" id="api-key" placeholder="貼上你的 Gemini API Key">
    </div>
    <div>
      <label>語言</label>
      <select id="language">
        <option value="繁體中文">繁體中文</option>
        <option value="auto">自動偵測</option>
        <option value="英文">英文</option>
        <option value="日文">日文</option>
        <option value="西班牙文">西班牙文</option>
      </select>
    </div>
    <div>
      <label>Gemini 模型</label>
      <input type="text" id="model" value="gemini-2.0-flash">
    </div>
    <div>
      <label>即時翻譯</label>
      <select id="translate-to">
        <option value="">不翻譯</option>
        <option value="英文">翻譯成英文</option>
        <option value="日文">翻譯成日文</option>
        <option value="繁體中文">翻譯成繁體中文</option>
        <option value="西班牙文">翻譯成西班牙文</option>
      </select>
    </div>

  </div>
</div>

<!-- Controls -->
<div class="card">
  <div class="btn-row">
    <button class="bp" id="btn-mic"    onclick="startMic()">🎙 麥克風收音</button>
    <button class="bp" id="btn-screen" onclick="startScreen()">🖥 分頁 / 視窗 / 螢幕收音</button>
    <button class="bd" id="btn-stop"   onclick="stopRecording()" disabled>■ 停止收音</button>
    <button class="bs" onclick="clearTranscript()">清除記錄</button>
    <button class="bg" onclick="downloadTranscript()">↓ 下載 Markdown</button>
  </div>
  <div class="note">
    🔒 分頁/螢幕收音：瀏覽器跳出視窗後，選「<b>分頁（Tab）</b>」並勾選「<b>共享分頁音訊</b>」，即可不裝任何軟體直接抓網頁聲音。電腦靜音也不影響轉錄。
  </div>
</div>

<!-- Status bar -->
<div id="sbar">
  <div id="sdot"></div>
  <span id="stext">尚未開始</span>
</div>

<!-- Transcript area -->
<div id="tarea">
  <div class="empty">開始收音後，逐字稿將出現在這裡</div>
</div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
let recorder      = null;
let activeStream  = null;
let isRecording   = false;
let pendingChunks = [];
let recordingSize = 0;
let autoFlushing  = false;
let sessionSegs   = [];
let chunkIdx      = 0;

// ── UI helpers ─────────────────────────────────────────────────────────────
function dot(cls) {
  document.getElementById('sdot').className = cls || '';
}
function status(msg, cls) {
  document.getElementById('stext').textContent = msg;
  dot(cls || '');
}
function setBtns(recording) {
  ['btn-mic', 'btn-screen'].forEach(id => document.getElementById(id).disabled = recording);
  document.getElementById('btn-stop').disabled = !recording;
}

// ── Core recording logic ───────────────────────────────────────────────────
function beginRecording(stream) {
  isRecording   = true;
  activeStream  = stream;
  pendingChunks = [];
  recordingSize = 0;
  autoFlushing  = false;
  chunkIdx      = 0;
  setBtns(true);
  startRecorderOnStream(stream);
}

function startRecorderOnStream(stream) {
  const mime = ['audio/webm;codecs=opus', 'audio/webm', 'audio/ogg']
    .find(t => MediaRecorder.isTypeSupported(t)) || '';

  recorder = new MediaRecorder(stream, mime ? { mimeType: mime } : {});

  recorder.ondataavailable = e => {
    if (!e.data || e.data.size === 0) return;
    pendingChunks.push(e.data);
    recordingSize += e.data.size;
    const mb = (recordingSize / 1024 / 1024).toFixed(1);
    status(`錄音中... ${mb} MB`, 'rec');
    if (recordingSize >= 18 * 1024 * 1024 && !autoFlushing) {
      autoFlushing = true;
      status('音訊達 18 MB，自動送出並繼續錄音...', 'proc');
      recorder.stop();
    }
  };

  recorder.onstop = async () => {
    if (!pendingChunks.length) {
      if (!isRecording) {
        if (activeStream) activeStream.getTracks().forEach(t => t.stop());
        setBtns(false);
        status('收音已結束', 'done');
      }
      return;
    }
    const blob = new Blob(pendingChunks, { type: recorder.mimeType || 'audio/webm' });
    pendingChunks = [];
    recordingSize = 0;
    chunkIdx++;
    status(`轉錄第 ${chunkIdx} 段中...`, 'proc');
    await sendToGemini(blob);
    if (isRecording) {
      autoFlushing = false;
      startRecorderOnStream(stream);
    } else {
      if (activeStream) activeStream.getTracks().forEach(t => t.stop());
      setBtns(false);
      status('收音已結束', 'done');
    }
  };

  recorder.start(5000); // 每 5 秒收集一次資料以監控大小
}

// ── Start mic ──────────────────────────────────────────────────────────────
async function startMic() {
  if (!validate()) return;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    status('錄音中（麥克風）', 'rec');
    beginRecording(stream);
  } catch (e) {
    status('⚠️ 無法存取麥克風：' + e.message);
  }
}

// ── Start screen / tab capture ─────────────────────────────────────────────
async function startScreen() {
  if (!validate()) return;
  try {
    const raw = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
    raw.getVideoTracks().forEach(t => t.stop());
    const audioTracks = raw.getAudioTracks();
    if (!audioTracks.length) {
      status('⚠️ 未取得音訊。請選「分頁（Tab）」並勾選「共享分頁音訊」。');
      return;
    }
    status('錄音中（分頁/螢幕）', 'rec');
    beginRecording(new MediaStream(audioTracks));
  } catch (e) {
    status(e.name === 'AbortError' ? '已取消選擇' : '⚠️ ' + e.message);
  }
}

// ── Stop ───────────────────────────────────────────────────────────────────
function stopRecording() {
  isRecording = false;
  if (recorder && recorder.state === 'recording') {
    status('停止收音，轉錄中...', 'proc');
    recorder.stop(); // onstop 會送出剩餘音訊並更新 UI
  } else {
    if (activeStream) activeStream.getTracks().forEach(t => t.stop());
    setBtns(false);
    status('收音已結束', 'done');
  }
}

// ── Validate ───────────────────────────────────────────────────────────────
function validate() {
  if (!document.getElementById('api-key').value.trim()) {
    status('⚠️ 請先填入 Gemini API Key');
    return false;
  }
  return true;
}

// ── Send chunk to Gemini ───────────────────────────────────────────────────
async function sendToGemini(blob, retryCount = 0) {
  const apiKey   = document.getElementById('api-key').value.trim();
  const language = document.getElementById('language').value;
  const glossary = '';
  const model    = document.getElementById('model').value.trim() || 'gemini-2.5-flash';
  const mimeType = blob.type || 'audio/webm';

  const translateTo = document.getElementById('translate-to').value;

  const langLine = language === 'auto'
    ? '自動辨識語言；中文內容請使用繁體中文字形。'
    : `主要語言為${language}，請使用對應的正體字形。`;

  const prompt = translateTo ? [
    '請完成以下兩件事：',
    `（1）忠實轉錄這段音訊，不可摘要、改寫或補充沒有說出的內容。${langLine}如有多位講者，格式為「講者X：文字」；若只有一人則省略講者標示。聽不清楚時保留最接近的原話。`,
    `（2）將上述轉錄內容翻譯成${translateTo}，翻譯力求自然流暢。`,
    glossary ? `下列為可能出現的專有名詞，請優先以這些詞彙拼寫：${glossary}` : '',
    '請嚴格按照以下格式輸出，不可增加任何其他說明：',
    '【原文】',
    '（轉錄內容）',
    '【翻譯】',
    '（翻譯內容）',
  ].filter(Boolean).join('\n') : [
    '忠實轉錄這段音訊，不可摘要、改寫或補充沒有說出的內容。',
    langLine,
    '如有多位講者，格式為「講者X：文字」；若只有一人則省略講者標示，直接輸出文字。',
    '聽不清楚時保留最接近的原話，不要自行猜測具體事實或補充未說出的內容。',
    glossary ? `下列為可能出現的專有名詞，請優先以這些詞彙拼寫：${glossary}` : '',
  ].filter(Boolean).join('\n');

  try {
    const base64 = await blobToBase64(blob);
    const res = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`,
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{
            parts: [
              { inline_data: { mime_type: mimeType, data: base64 } },
              { text: prompt },
            ],
          }],
          generation_config: { temperature: 0 },
        }),
      }
    );

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      const msg = err?.error?.message || res.statusText;

      const retryS  = msg.match(/retry in ([\d.]+)s\b/i);
      const retryMs = msg.match(/retry in ([\d.]+)ms\b/i);
      const waitSec = retryS
        ? Math.ceil(parseFloat(retryS[1]))
        : retryMs
          ? Math.max(1, Math.ceil(parseFloat(retryMs[1]) / 1000))
          : null;
      if (waitSec !== null && retryCount < 3) {
        for (let i = waitSec; i > 0; i--) {
          status(`API 限速，${i} 秒後自動重試...`, 'proc');
          await new Promise(r => setTimeout(r, 1000));
        }
        return sendToGemini(blob, retryCount + 1);
      }

      appendSeg('', `⚠️ Gemini 錯誤：${msg}`);
      status(`第 ${chunkIdx} 段轉錄失敗`, 'rec');
      return;
    }

    const data = await res.json();
    const raw  = data?.candidates?.[0]?.content?.parts?.[0]?.text || '（無法辨識）';
    const now  = new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

    const origMatch  = raw.match(/【原文】\s*([\s\S]*?)(?=【翻譯】|$)/);
    const transMatch = raw.match(/【翻譯】\s*([\s\S]*?)$/);
    const origText   = origMatch  ? origMatch[1].trim()  : raw.trim();
    const transText  = transMatch ? transMatch[1].trim() : null;

    appendSeg(now, origText, transText);
    status(`第 ${chunkIdx} 段完成`, 'rec');

  } catch (e) {
    appendSeg('', `⚠️ 網路錯誤：${e.message}`);
  }
}

// ── Append segment ─────────────────────────────────────────────────────────
function appendSeg(time, text, translation = null) {
  sessionSegs.push({ time, text, translation });

  const area = document.getElementById('tarea');
  const empty = area.querySelector('.empty');
  if (empty) empty.remove();

  if (sessionSegs.length > 1) {
    const hr = document.createElement('hr');
    hr.className = 'divider';
    area.appendChild(hr);
  }

  const seg = document.createElement('div');
  if (time) {
    const t = document.createElement('div');
    t.className = 'seg-time';
    t.textContent = time;
    seg.appendChild(t);
  }
  const p = document.createElement('div');
  p.className = 'seg-text';
  p.textContent = text;
  seg.appendChild(p);

  if (translation) {
    const tBlock = document.createElement('div');
    tBlock.className = 'seg-translation';
    const lbl = document.createElement('div');
    lbl.className = 'seg-translation-label';
    lbl.textContent = document.getElementById('translate-to').value;
    const tTxt = document.createElement('div');
    tTxt.textContent = translation;
    tBlock.appendChild(lbl);
    tBlock.appendChild(tTxt);
    seg.appendChild(tBlock);
  }

  area.appendChild(seg);
  area.scrollTop = area.scrollHeight;
}

// ── Clear ──────────────────────────────────────────────────────────────────
function clearTranscript() {
  sessionSegs = [];
  chunkIdx    = 0;
  document.getElementById('tarea').innerHTML =
    '<div class="empty">開始收音後，逐字稿將出現在這裡</div>';
  status('已清除記錄');
}

// ── Download Markdown ──────────────────────────────────────────────────────
function downloadTranscript() {
  if (!sessionSegs.length) { status('⚠️ 尚無內容可下載'); return; }
  const today = new Date().toLocaleDateString('zh-TW').replace(/\//g, '-');
  let md = `# 逐字稿 ${today}\n\n`;
  sessionSegs.forEach((s, i) => {
    if (i > 0) md += '\n---\n\n';
    if (s.time) md += `**${s.time}**\n\n`;
    md += s.text + '\n';
    if (s.translation) md += `\n> ${s.translation.replace(/\n/g, '\n> ')}\n`;
  });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([md], { type: 'text/markdown;charset=utf-8' }));
  a.download = `逐字稿_${today}.md`;
  a.click();
  URL.revokeObjectURL(a.href);
}

// ── QR Code ────────────────────────────────────────────────────────────────
(function () {
  const s = document.createElement('script');
  s.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
  s.onload = () => new QRCode(document.getElementById('qrcode'), {
    text: location.href,
    width: 90, height: 90,
    colorDark: '#1e293b', colorLight: '#ffffff',
    correctLevel: QRCode.CorrectLevel.M,
  });
  document.head.appendChild(s);
})();

// ── Blob → base64 ─────────────────────────────────────────────────────────
function blobToBase64(blob) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onloadend = () => res(r.result.split(',')[1]);
    r.onerror   = rej;
    r.readAsDataURL(blob);
  });
}
</script>
</body>
</html>
