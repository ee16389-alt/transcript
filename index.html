<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>即時逐字稿</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #f8fafc;
  --surface: #ffffff;
  --border: #e2e8f0;
  --primary: #6366f1;
  --primary-h: #4f46e5;
  --text: #1e293b;
  --muted: #64748b;
  --success: #10b981;
  --warning: #f59e0b;
  --danger: #ef4444;
  --r: 8px;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  padding: 1.5rem;
  max-width: 860px;
  margin: 0 auto;
}

h1 { font-size: 1.6rem; font-weight: 700; margin-bottom: .2rem; }
.sub { color: var(--muted); font-size: .875rem; margin-bottom: 1.25rem; }

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 1.1rem 1.25rem;
  margin-bottom: .875rem;
}

.card-title { font-size: .9rem; font-weight: 600; margin-bottom: .85rem; }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: .65rem; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: .65rem; }
.full  { grid-column: 1 / -1; }

label { display: block; font-size: .75rem; font-weight: 500; color: var(--muted); margin-bottom: .2rem; }

input[type=text], input[type=password], select {
  width: 100%; padding: .45rem .7rem;
  border: 1px solid var(--border); border-radius: 6px;
  font-size: .875rem; font-family: inherit; color: var(--text);
  background: var(--surface);
}
input:focus, select:focus { outline: none; border-color: var(--primary); }

.btn-row { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }

button {
  padding: .45rem 1rem; border: none; border-radius: 6px;
  font-size: .875rem; font-weight: 500; cursor: pointer;
  transition: background .12s, opacity .12s;
  white-space: nowrap;
}
button:disabled { opacity: .4; cursor: not-allowed; }

.bp  { background: var(--primary);   color: #fff; }
.bp:hover:not(:disabled) { background: var(--primary-h); }
.bs  { background: #f1f5f9; color: var(--text); }
.bs:hover:not(:disabled)  { background: #e2e8f0; }
.bd  { background: #fee2e2; color: var(--danger); }
.bd:hover:not(:disabled)  { background: #fecaca; }
.bg  { background: #d1fae5; color: #065f46; }
.bg:hover:not(:disabled)  { background: #a7f3d0; }

/* status bar */
#sbar {
  display: flex; align-items: center; gap: .6rem;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r); padding: .6rem 1rem;
  margin-bottom: .875rem; font-size: .875rem; color: var(--muted);
}
#sdot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--muted); flex-shrink: 0;
}
#sdot.rec  { background: var(--danger);  animation: blink 1.2s infinite; }
#sdot.proc { background: var(--warning); }
#sdot.done { background: var(--success); }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.35} }

/* transcript */
#tarea {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r); padding: 1.1rem 1.25rem;
  min-height: 280px; max-height: 58vh;
  overflow-y: auto; font-size: .9rem; line-height: 1.8;
}
.empty { color: var(--muted); font-size: .875rem; text-align: center; padding: 2.5rem 1rem; }
.seg-time { font-size: .72rem; font-weight: 600; color: var(--muted); margin-bottom: .2rem; letter-spacing: .02em; }
.seg-text { white-space: pre-wrap; word-break: break-word; }
.divider  { border: none; border-top: 1px solid var(--border); margin: .85rem 0; }

/* privacy note */
.note {
  font-size: .75rem; color: var(--muted);
  background: #f8fafc; border: 1px solid var(--border);
  border-radius: 6px; padding: .5rem .75rem;
  margin-top: .875rem;
}
</style>
</head>
<body>

<h1>即時逐字稿</h1>
<p class="sub">音訊在瀏覽器直接呼叫 Gemini 轉錄，API Key 只存在記憶體不寫入磁碟，逐字稿下載到本機。</p>

<!-- Settings -->
<div class="card">
  <div class="card-title">設定</div>
  <div class="grid2">
    <div>
      <label>Gemini API Key</label>
      <input type="password" id="api-key" placeholder="貼上你的 Gemini API Key">
    </div>
    <div>
      <label>語言</label>
      <select id="language">
        <option value="繁體中文">繁體中文</option>
        <option value="auto">自動偵測</option>
        <option value="英文">英文</option>
        <option value="日文">日文</option>
        <option value="西班牙文">西班牙文</option>
      </select>
    </div>
    <div>
      <label>自動分段間隔</label>
      <select id="interval" onchange="updateIntervalHint(this.value)">
        <option value="30">30 秒</option>
        <option value="60" selected>60 秒</option>
        <option value="120">2 分鐘</option>
      </select>
      <div id="interval-hint" style="font-size:.72rem;color:var(--muted);margin-top:.3rem;">
        免費額度每天可錄約 <b>25 小時</b>（1500 次 × 60 秒）
      </div>
    </div>
    <div>
      <label>Gemini 模型</label>
      <input type="text" id="model" value="gemini-2.5-flash">
    </div>

  </div>
</div>

<!-- Controls -->
<div class="card">
  <div class="btn-row">
    <button class="bp" id="btn-mic"    onclick="startMic()">🎙 麥克風收音</button>
    <button class="bp" id="btn-screen" onclick="startScreen()">🖥 分頁 / 視窗 / 螢幕收音</button>
    <button class="bd" id="btn-stop"   onclick="stopRecording()" disabled>■ 停止收音</button>
    <button class="bs" onclick="clearTranscript()">清除記錄</button>
    <button class="bg" onclick="downloadTranscript()">↓ 下載 Markdown</button>
  </div>
  <div class="note">
    🔒 分頁/螢幕收音：瀏覽器跳出視窗後，選「<b>分頁（Tab）</b>」並勾選「<b>共享分頁音訊</b>」，即可不裝任何軟體直接抓網頁聲音。電腦靜音也不影響轉錄。
  </div>
</div>

<!-- Status bar -->
<div id="sbar">
  <div id="sdot"></div>
  <span id="stext">尚未開始</span>
</div>

<!-- Transcript area -->
<div id="tarea">
  <div class="empty">開始收音後，逐字稿將出現在這裡</div>
</div>

<script>
// ── Interval hint ─────────────────────────────────────────────────────────
function updateIntervalHint(val) {
  const hrs = { '30': '12.5', '60': '25', '120': '50' };
  const label = { '30': '30 秒', '60': '60 秒', '120': '2 分鐘' };
  document.getElementById('interval-hint').innerHTML =
    `免費額度每天可錄約 <b>${hrs[val]} 小時</b>（1500 次 × ${label[val]}）`;
}

// ── State ──────────────────────────────────────────────────────────────────
let recorder        = null;
let activeStream    = null;
let isRecording     = false;
let pendingChunks   = [];
let chunkTimer      = null;
let countdownTimer  = null;
let sessionSegs     = [];
let chunkIdx        = 0;

// ── UI helpers ─────────────────────────────────────────────────────────────
function dot(cls) {
  document.getElementById('sdot').className = cls || '';
}
function status(msg, cls) {
  document.getElementById('stext').textContent = msg;
  dot(cls || '');
}
function setBtns(recording) {
  ['btn-mic', 'btn-screen'].forEach(id => document.getElementById(id).disabled = recording);
  document.getElementById('btn-stop').disabled = !recording;
}

// ── Countdown ──────────────────────────────────────────────────────────────
function startCountdown(sec) {
  clearInterval(countdownTimer);
  let t = sec;
  countdownTimer = setInterval(() => {
    t--;
    if (t <= 0) { clearInterval(countdownTimer); return; }
    status(`錄音中... 距下次轉錄 ${t} 秒`, 'rec');
  }, 1000);
}

// ── Core recording logic ───────────────────────────────────────────────────
function beginRecording(stream) {
  isRecording   = true;
  activeStream  = stream;
  pendingChunks = [];
  chunkIdx      = 0;
  setBtns(true);

  const mime = ['audio/webm;codecs=opus', 'audio/webm', 'audio/ogg']
    .find(t => MediaRecorder.isTypeSupported(t)) || '';

  recorder = new MediaRecorder(stream, mime ? { mimeType: mime } : {});

  recorder.ondataavailable = e => {
    if (e.data && e.data.size > 0) pendingChunks.push(e.data);
  };

  recorder.onstop = async () => {
    if (!pendingChunks.length) return;
    const blob = new Blob(pendingChunks, { type: recorder.mimeType || 'audio/webm' });
    pendingChunks = [];
    chunkIdx++;
    status(`轉錄第 ${chunkIdx} 段中...`, 'proc');
    await sendToGemini(blob);
    if (isRecording) scheduleNext();
  };

  scheduleNext(true);
}

function scheduleNext(first = false) {
  const sec = parseInt(document.getElementById('interval').value) || 60;
  if (!first) {
    recorder.start();
  } else {
    recorder.start();
  }
  startCountdown(sec);
  chunkTimer = setTimeout(() => {
    if (recorder && recorder.state === 'recording') recorder.stop();
  }, sec * 1000);
}

// ── Start mic ──────────────────────────────────────────────────────────────
async function startMic() {
  if (!validate()) return;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    status('錄音中（麥克風）', 'rec');
    beginRecording(stream);
  } catch (e) {
    status('⚠️ 無法存取麥克風：' + e.message);
  }
}

// ── Start screen / tab capture ─────────────────────────────────────────────
async function startScreen() {
  if (!validate()) return;
  try {
    const raw = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
    raw.getVideoTracks().forEach(t => t.stop());
    const audioTracks = raw.getAudioTracks();
    if (!audioTracks.length) {
      status('⚠️ 未取得音訊。請選「分頁（Tab）」並勾選「共享分頁音訊」。');
      return;
    }
    status('錄音中（分頁/螢幕）', 'rec');
    beginRecording(new MediaStream(audioTracks));
  } catch (e) {
    status(e.name === 'AbortError' ? '已取消選擇' : '⚠️ ' + e.message);
  }
}

// ── Stop ───────────────────────────────────────────────────────────────────
function stopRecording() {
  isRecording = false;
  clearTimeout(chunkTimer);
  clearInterval(countdownTimer);
  if (recorder && recorder.state === 'recording') recorder.stop();
  if (activeStream) activeStream.getTracks().forEach(t => t.stop());
  setBtns(false);
  status('收音已結束', 'done');
}

// ── Validate ───────────────────────────────────────────────────────────────
function validate() {
  if (!document.getElementById('api-key').value.trim()) {
    status('⚠️ 請先填入 Gemini API Key');
    return false;
  }
  return true;
}

// ── Send chunk to Gemini ───────────────────────────────────────────────────
async function sendToGemini(blob) {
  const apiKey   = document.getElementById('api-key').value.trim();
  const language = document.getElementById('language').value;
  const glossary = '';
  const model    = document.getElementById('model').value.trim() || 'gemini-2.5-flash';
  const mimeType = blob.type || 'audio/webm';

  const langLine = language === 'auto'
    ? '自動辨識語言；中文內容請使用繁體中文字形。'
    : `主要語言為${language}，請使用對應的正體字形。`;

  const prompt = [
    '忠實轉錄這段音訊，不可摘要、改寫或補充沒有說出的內容。',
    langLine,
    '如有多位講者，格式為 [MM:SS] 講者X：文字；若只有一人則省略講者標示，直接輸出文字。',
    '聽不清楚時保留最接近的原話，不要自行猜測具體事實或補充未說出的內容。',
    glossary ? `下列為可能出現的專有名詞，請優先以這些詞彙拼寫：${glossary}` : '',
  ].filter(Boolean).join('\n');

  try {
    const base64 = await blobToBase64(blob);
    const res = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`,
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{
            parts: [
              { inline_data: { mime_type: mimeType, data: base64 } },
              { text: prompt },
            ],
          }],
          generation_config: { temperature: 0 },
        }),
      }
    );

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      const msg = err?.error?.message || res.statusText;
      appendSeg('', `⚠️ Gemini 錯誤：${msg}`);
      status(`第 ${chunkIdx} 段失敗`, 'rec');
      return;
    }

    const data = await res.json();
    const text = data?.candidates?.[0]?.content?.parts?.[0]?.text || '（無法辨識）';
    const now  = new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    appendSeg(now, text.trim());
    status(`第 ${chunkIdx} 段完成`, 'rec');

  } catch (e) {
    appendSeg('', `⚠️ 網路錯誤：${e.message}`);
  }
}

// ── Append segment ─────────────────────────────────────────────────────────
function appendSeg(time, text) {
  sessionSegs.push({ time, text });

  const area = document.getElementById('tarea');
  const empty = area.querySelector('.empty');
  if (empty) empty.remove();

  if (sessionSegs.length > 1) {
    const hr = document.createElement('hr');
    hr.className = 'divider';
    area.appendChild(hr);
  }

  const seg = document.createElement('div');
  if (time) {
    const t = document.createElement('div');
    t.className = 'seg-time';
    t.textContent = time;
    seg.appendChild(t);
  }
  const p = document.createElement('div');
  p.className = 'seg-text';
  p.textContent = text;
  seg.appendChild(p);
  area.appendChild(seg);
  area.scrollTop = area.scrollHeight;
}

// ── Clear ──────────────────────────────────────────────────────────────────
function clearTranscript() {
  sessionSegs = [];
  chunkIdx    = 0;
  document.getElementById('tarea').innerHTML =
    '<div class="empty">開始收音後，逐字稿將出現在這裡</div>';
  status('已清除記錄');
}

// ── Download Markdown ──────────────────────────────────────────────────────
function downloadTranscript() {
  if (!sessionSegs.length) { status('⚠️ 尚無內容可下載'); return; }
  const today = new Date().toLocaleDateString('zh-TW').replace(/\//g, '-');
  let md = `# 逐字稿 ${today}\n\n`;
  sessionSegs.forEach((s, i) => {
    if (i > 0) md += '\n---\n\n';
    if (s.time) md += `**${s.time}**\n\n`;
    md += s.text + '\n';
  });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([md], { type: 'text/markdown;charset=utf-8' }));
  a.download = `逐字稿_${today}.md`;
  a.click();
  URL.revokeObjectURL(a.href);
}

// ── Blob → base64 ─────────────────────────────────────────────────────────
function blobToBase64(blob) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onloadend = () => res(r.result.split(',')[1]);
    r.onerror   = rej;
    r.readAsDataURL(blob);
  });
}
</script>
</body>
</html>
